<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Device Info Report</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 900px; margin: 32px auto; line-height: 1.4; }
pre { background: #f6f8fa; padding: 16px; border-radius: 8px; overflow: auto; }
.consent { padding: 12px 16px; border-radius: 8px; margin: 16px 0; background: #fff8e1; border: 1px solid #ffe082; }
button { padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<h1>Device Info Report (Consent Needed)</h1>
<p class="consent">
This page collects your device info (OS, browser, GPU, battery, screen, network) and sends it to the server for demonstration.
By clicking “Generate Report”, you consent.
</p>

<button id="start">Generate Report</button>
<div id="status"></div>
<h2>Your Report</h2>
<pre id="output">Not started yet…</pre>

<script>
const LOG_ENDPOINT = "/log"; // replace with public URL if deployed

async function estimateRefreshRate(samples=60){
  return new Promise(resolve=>{
    let count=0, start=null;
    function step(ts){
      if(start===null){ start=ts; count=0; }
      else if(count>=samples){ resolve(Math.round(count*1000/(ts-start))); return; }
      count++; requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function getWebGLInfo(){
  const canvas = document.createElement("canvas");
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if(!gl) return {};
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  return {
    vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : "Unknown",
    renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "Unknown"
  };
}

async function collect(){
  const nav = navigator;
  const battery = nav.getBattery ? await nav.getBattery().catch(()=>null) : null;
  const refresh = await estimateRefreshRate(90);
  const webgl = getWebGLInfo();
  const storage = await (navigator.storage && navigator.storage.estimate ? navigator.storage.estimate() : {});

  return {
    timestamp: new Date().toISOString(),
    userAgent: nav.userAgent,
    platform: nav.platform || "Unknown",
    languages: nav.languages || [nav.language],
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    hardwareConcurrency: nav.hardwareConcurrency || null,
    deviceMemory: nav.deviceMemory || null,
    connectionType: nav.connection ? nav.connection.effectiveType : "Unknown",
    online: navigator.onLine,
    screen: {
      width: screen.width,
      height: screen.height,
      devicePixelRatio: window.devicePixelRatio || 1,
      estimatedRefreshRateHz: refresh
    },
    battery,
    webgl,
    storage,
    touchSupport: 'ontouchstart' in window || nav.maxTouchPoints>0
  };
}

function makeReport(data){
  let r = `Device Report:\n\n`;
  r += `IP: ${data.ip || "Unknown"}\n`;
  r += `Browser: ${data.userAgent}\nPlatform: ${data.platform}\nLanguages: ${data.languages.join(", ")}\n`;
  r += `Screen: ${data.screen.width}x${data.screen.height}, DPR: ${data.screen.devicePixelRatio}, Refresh: ${data.screen.estimatedRefreshRateHz}Hz\n`;
  r += `GPU: ${data.webgl.renderer} (${data.webgl.vendor})\n`;
  r += `Battery: ${data.battery ? (data.battery.level*100+"% "+(data.battery.charging?"charging":"not charging")) : "Unknown"}\n`;
  r += `Connection: ${data.connectionType}, Online: ${data.online}\n`;
  r += `Memory: ${data.deviceMemory || "?"}GB, Threads: ${data.hardwareConcurrency}\n`;
  r += `Touch Support: ${data.touchSupport ? "Yes" : "No"}\n`;
  r += `Storage Estimate: ${data.storage.quota ? Math.round(data.storage.quota/1024/1024)+"MB" : "Unknown"}\n`;
  r += `Timestamp: ${data.timestamp}\n`;
  return r;
}

async function send(data){
  try{
    const res = await fetch(LOG_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });
    return await res.json();
  }catch(e){
    return { ok:false, error:String(e) };
  }
}

document.getElementById('start').addEventListener('click', async ()=>{
  document.getElementById('status').textContent = "Collecting…";
  const data = await collect();
  document.getElementById('output').textContent = makeReport(data);
  const res = await send(data);
  document.getElementById('status').textContent = res.ok ? "Sent to server ✔" : ("Not sent: " + res.error);
});
</script>
</body>
</html>
